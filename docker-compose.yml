version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Services
#   app    — Flask API served by gunicorn (always started)
#   nginx  — Reverse proxy in front of app (opt-in via --profile with-nginx)
#
# Usage:
#   API only:             docker-compose up -d
#   API + Nginx on :80:   docker-compose --profile with-nginx up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  app:
    build:
      context: .
      target: runtime          # use the final multi-stage layer
    image: driver-alertness:latest
    container_name: alertness-api
    env_file:
      - .env                   # optional — ignored if file is absent
    environment:
      FLASK_ENV: production
      MODEL_PATH: /app/outputs/models/best_model.pt
    volumes:
      # Mount the local outputs/ directory so trained models survive container restarts.
      # Use :ro if the container should never write back (e.g. read-only inference).
      - ./outputs:/app/outputs
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped


  nginx:
    image: nginx:1.25-alpine
    container_name: alertness-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # Only starts when the "with-nginx" profile is requested:
    #   docker-compose --profile with-nginx up -d
    profiles:
      - with-nginx
