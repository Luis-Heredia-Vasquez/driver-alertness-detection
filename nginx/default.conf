# Nginx reverse-proxy config for Driver Alertness Detection API
# Used by the "with-nginx" docker-compose profile.

upstream alertness {
    server app:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Maximum upload size (base64 frames can be large)
    client_max_body_size 10m;

    # Compress JSON and text responses
    gzip on;
    gzip_types text/plain application/json text/html;
    gzip_min_length 512;

    # Proxy all traffic to the gunicorn app
    location / {
        proxy_pass         http://alertness;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # Health endpoint — skip access log to avoid noise
    location /health {
        proxy_pass   http://alertness;
        access_log   off;
        add_header   Cache-Control "no-store";
    }
}
