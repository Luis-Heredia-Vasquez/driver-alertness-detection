# Default Configuration for Driver Alertness Detection System
# All hyperparameters, thresholds, and training parameters

default:
  # Model Architecture
  model:
    name: "SimpleCNN"
    input_size: [3, 64, 64]
    num_classes: 2  # 0: Alert, 1: Drowsy
    device: "cuda"  # or "cpu"

  # Facial Metric Thresholds
  thresholds:
    ear:           0.25    # Eye Aspect Ratio threshold for blink detection
    mar:           0.6     # Mouth Aspect Ratio threshold for yawn detection
    perclos:       0.8     # PERCLOS threshold for drowsiness (% of time eyes closed)
    ear_window:    10      # Frames to average for PERCLOS calculation
    perclos_window: 30     # PERCLOS evaluation window in frames

  # Training Hyperparameters
  training:
    batch_size:    32
    epochs:        50
    learning_rate: 0.001
    optimizer:     "adam"  # adam, sgd
    criterion:     "cross_entropy"
    weight_decay:  0.0001
    momentum:      0.9     # For SGD
    warmup_epochs: 5
    scheduler:     "cosine"  # cosine, step, exponential
    scheduler_step: 10

  # Data Pipeline
  data:
    train_ratio:   0.7
    val_ratio:     0.15
    test_ratio:    0.15
    augmentation:
      enabled:     true
      brightness:  0.2
      contrast:    0.2
      rotation:    15
      flip_prob:   0.5
    preprocessing:
      resize_to:   64
      normalize:   true  # Normalize to [0, 1]
      equalize:    false

  # Paths
  paths:
    data_dir:      "data/"
    output_dir:    "outputs/"
    models_dir:    "outputs/models/"
    plots_dir:     "outputs/plots/"
    logs_dir:      "outputs/logs/"
    checkpoint:    null  # Path to resume from, if any

  # Logging & Monitoring
  logging:
    level:         "INFO"  # DEBUG, INFO, WARNING, ERROR
    save_interval: 5       # Epochs between checkpoints
    eval_interval: 1       # Epochs between evaluations
    tensorboard:   true

  # Inference (Webcam & Live)
  inference:
    confidence_threshold: 0.7
    frame_skip:          0     # Process every Nth frame (0 = all frames)
    display_fps:         true
    display_landmarks:   true
    display_metrics:     true
    alert_sound:         false
