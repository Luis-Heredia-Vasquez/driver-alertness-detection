# Default Configuration for Driver Alertness Detection System
# All hyperparameters, thresholds, and training parameters

default:
  # Model Architecture
  model:
    name: "SimpleCNN"
    input_size: [3, 64, 64]    # channels, height, width
    num_classes: 2              # 0: Alert, 1: Drowsy
    device: "cuda"              # or "cpu"

  # Facial Metric Thresholds
  thresholds:
    ear:            0.25        # Eye Aspect Ratio — below this counts as "closed"
    mar:            0.6         # Mouth Aspect Ratio — above this counts as "open/yawning"
    perclos:        0.8         # PERCLOS alert level (fraction of window where eyes closed)
    ear_window:     10          # Frames to use for blink-count sliding window
    perclos_window: 30          # PERCLOS evaluation window in frames

  # Training Hyperparameters
  training:
    batch_size:     32
    epochs:         50
    learning_rate:  0.001
    optimizer:      "adam"      # adam | sgd
    criterion:      "cross_entropy"
    weight_decay:   0.0001
    momentum:       0.9         # SGD momentum (ignored for Adam)
    warmup_epochs:  5
    scheduler:      "cosine"    # cosine | step | exponential
    scheduler_step: 10          # StepLR step size (epochs)

  # Data Pipeline
  data:
    train_ratio:    0.70
    val_ratio:      0.15
    test_ratio:     0.15
    augmentation:
      enabled:      true
      brightness:   0.2
      contrast:     0.2
      rotation:     15          # degrees
      flip_prob:    0.5
    preprocessing:
      resize_to:    64          # pixels (square)
      normalize:    true        # scale to [0, 1]
      equalize:     false

  # Paths
  paths:
    data_dir:       "data/"
    output_dir:     "outputs/"
    models_dir:     "outputs/models/"
    plots_dir:      "outputs/plots/"
    logs_dir:       "outputs/logs/"
    checkpoint:     null        # set to resume path to continue training

  # Logging & Checkpointing
  logging:
    level:          "INFO"      # DEBUG | INFO | WARNING | ERROR
    save_interval:  5           # epochs between checkpoint saves
    eval_interval:  1           # epochs between validation runs
    tensorboard:    true

  # Inference (webcam & live API)
  inference:
    confidence_threshold: 0.7
    frame_skip:     0           # process every Nth frame (0 = every frame)
    display_fps:    true
    display_landmarks: true
    display_metrics:   true
    alert_sound:    false
